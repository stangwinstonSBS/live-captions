<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Live Captions</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--fg:#14171c;--muted:#5b6470;--line:#d9dee4;--accent:#1f6feb;--accent-fg:#fff;--ok:#1a8f3c;--warn:#b25b00;--bad:#c62828;--nameL:33%;--textL:20%;--tint:.09;--fs:30px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1115;--panel:#171b21;--fg:#eef1f5;--muted:#9aa4b1;--line:#2a3039;--accent:#4c8dff;--accent-fg:#fff;--ok:#3ccf6a;--warn:#ffb14a;--bad:#ff6b6b;--nameL:72%;--textL:90%;--tint:.15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1115;--panel:#171b21;--fg:#eef1f5;--muted:#9aa4b1;--line:#2a3039;--accent:#4c8dff;--accent-fg:#fff;--ok:#3ccf6a;--warn:#ffb14a;--bad:#ff6b6b;--nameL:72%;--textL:90%;--tint:.15;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.45em .8em;min-height:44px;min-width:44px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.big{width:100%;padding:.8em;font-size:1.1em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.chip{--h:205;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:hsla(var(--h),70%,50%,var(--tint));border:1px solid hsla(var(--h),70%,50%,.55);color:hsl(var(--h),75%,var(--nameL));font-weight:600;white-space:nowrap}
.chip .dot{background:hsl(var(--h),75%,52%)}
button.chip{font:inherit;cursor:pointer;min-height:36px}
.huepop{position:absolute;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(5,44px);gap:10px;z-index:30}
.huepop .lbl{grid-column:1/-1;font-weight:700}
.swatch{--h:205;width:44px;height:44px;border-radius:50%;border:3px solid var(--panel);outline:2px solid transparent;background:hsl(var(--h),75%,52%);cursor:pointer}
.swatch.sel{outline-color:var(--fg)}
.swatch:focus-visible{outline-color:var(--accent)}
.chip.talking .dot{animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.55}}

/* ---------- host ---------- */
.host{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.roombtn{display:inline-flex;align-items:center;gap:8px;font-weight:700;max-width:46vw}
.roombtn .rn{overflow:hidden;text-overflow:ellipsis}
#status{color:var(--muted);font-size:.92em}
.roomlist{display:flex;flex-direction:column;gap:8px;margin:14px 0;text-align:left}
.roomrow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px}
.roomrow.current{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.roomrow .roomname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:.5em;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:44px}
.roomrow input,.addroom input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:.5em .7em;background:var(--bg);font-size:17px}
.badge{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;padding:0 4px}
.addroom{display:flex;gap:8px}
.mt{margin-top:12px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tools{display:flex;gap:6px;margin-left:auto}
@media (max-width:640px){.chips{order:3;flex-basis:100%}}
.menu{position:absolute;right:12px;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.menu button{background:none;border:0;text-align:left;padding:.65em .8em;border-radius:8px;cursor:pointer;min-height:44px}
.menu button:hover{background:var(--line)}
.seg-row{padding:.5em .8em .7em;border-bottom:1px solid var(--line);margin-bottom:4px}
.seg-lbl{font-weight:600}
.seg{display:flex;gap:4px;margin-top:6px}
.menu .seg button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:.3em .35em;text-align:center;font-size:14px}
.menu .seg button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.seg-help{font-size:13px;color:var(--muted);margin-top:6px;max-width:17em}
.feedwrap{position:relative;flex:1;min-height:0}
.feed{position:absolute;inset:0;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));font-size:var(--fs);-webkit-overflow-scrolling:touch}
.turn{--h:0;margin:0 0 .4em;padding:.2em .6em .3em;border-left:max(5px,.2em) solid hsl(var(--h),75%,55%);background:hsla(var(--h),70%,50%,var(--tint));border-radius:0 .3em .3em 0}
.who{font-size:max(13px,.46em);font-weight:700;color:hsl(var(--h),80%,var(--nameL));display:flex;gap:.7em;align-items:baseline}
.who time{font-weight:400;color:var(--muted)}
.said{color:hsl(var(--h),50%,var(--textL));line-height:1.3;overflow-wrap:anywhere}
.said .live{opacity:.62}
.said .line + .line{margin-top:.12em}
.turn.me{border-left-color:var(--muted);background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.turn.me .who{color:var(--muted)}.turn.me .said{color:var(--fg)}
.empty{color:var(--muted);font-size:20px;text-align:center;margin:12vh auto 0;max-width:28em;padding:0 8px}
.jump{position:absolute;right:16px;bottom:12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.reply{border-top:1px solid var(--line);background:var(--panel);padding:8px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.reply form{display:flex;gap:8px}
.reply input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:.5em .8em;background:var(--bg);font-size:18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--panel);border-radius:18px;padding:20px;width:min(440px,100%);max-height:100%;overflow:auto;text-align:center}
.sheet h2{margin:0 0 4px}
.qr{background:#fff;padding:12px;border-radius:12px;width:min(300px,70vw,42vh);margin:10px auto}
.qr svg{display:block;width:100%;height:auto}
.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;color:var(--muted);margin:4px 0}
.note{color:var(--warn);font-weight:600}
label{display:block;text-align:left;font-weight:600;margin:14px 0}
label input,label select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:.6em .8em;background:var(--bg);font-size:18px;font-weight:400}

/* ---------- guest ---------- */
.gwrap{--h:205;max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font-size:1.5em;margin:0 0 .3em}
.lead{color:var(--muted);margin:0}
.gmain{display:flex;flex-direction:column;gap:14px;flex:1}
.gtop{display:flex;align-items:center;gap:8px;font-size:15px}
.gtop .chip{margin-left:auto;cursor:pointer;font-size:16px;border-style:solid}
.mic{width:min(170px,46vw);aspect-ratio:1;border-radius:50%;border:0;margin:6px auto 0;display:grid;place-items:center;background:var(--line);color:var(--fg);cursor:pointer;position:relative}
.mic svg{width:40%;height:40%}
.mic.on{background:hsl(var(--h),70%,46%);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid hsl(var(--h),70%,55%);animation:ring 1.6s infinite}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.12);opacity:0}}
.hint{text-align:center;color:var(--muted);margin:0;min-height:1.4em}
.hint.bad{color:var(--bad);font-weight:600}
.heard{min-height:5em}
.heard .old{color:var(--muted);font-size:17px;margin:2px 0}
.tick{font-weight:700;color:var(--warn)}.tick.ok{color:var(--ok)}
.legend{color:var(--muted);font-size:12px;margin-top:6px}
.livebig{color:hsl(var(--h),50%,var(--textL));font-size:24px;min-height:1.4em;font-style:italic}
.replycard{border-radius:16px;padding:12px 16px;background:var(--accent);color:var(--accent-fg);font-size:24px;line-height:1.3}
.replycard .from{font-size:13px;opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.typeform{display:flex;gap:8px;margin-top:auto}
.typeform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:.55em .8em;background:var(--panel);font-size:18px}
.warn{color:var(--warn);font-weight:600}
.fatal{max-width:480px;margin:20vh auto;font-size:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<template id="tpl-host">
<div class="host">
  <header class="bar">
    <div class="brand"><button id="bRooms" class="btn roombtn" title="Rooms"><span id="dot" class="dot warn"></span><span id="roomName" class="rn"></span><span aria-hidden="true">▾</span></button><span id="status">Connecting…</span></div>
    <div id="chips" class="chips" aria-label="People connected"></div>
    <div class="tools">
      <button id="bInvite" class="btn primary">Invite</button>
      <button id="bSmaller" class="btn" aria-label="Smaller text">A−</button>
      <button id="bBigger" class="btn" aria-label="Bigger text">A+</button>
      <button id="bMenu" class="btn" aria-label="More options" aria-expanded="false">⋯</button>
    </div>
    <div id="menu" class="menu" hidden>
      <div class="seg-row">
        <div class="seg-lbl">Filter other voices</div>
        <div id="sens" class="seg" role="radiogroup" aria-label="Filter other voices"></div>
        <div id="sensHelp" class="seg-help"></div>
      </div>
      <button id="bRoom">Room mic (this device listens)</button>
      <button id="bSave">Save transcript</button>
      <button id="bClear">Clear transcript</button>
      <button id="bTheme">Light / dark</button>
    </div>
    <div id="huePop" class="huepop" role="dialog" aria-label="Choose a color" hidden></div>
  </header>
  <div class="feedwrap">
    <main id="feed" class="feed" aria-live="polite">
      <div id="empty" class="empty">Tap <b>Invite</b> and have people scan the code with their phone camera.<br>Everything they say shows up here, with their name and color.</div>
    </main>
    <button id="jump" class="btn primary jump" hidden>↓ Latest</button>
  </div>
  <footer class="reply">
    <div id="quick" class="quick"></div>
    <form id="replyForm"><input id="replyIn" placeholder="Type to show on everyone's phone…" autocomplete="off" enterkeyhint="send" maxlength="1000"><button class="btn primary">Send</button></form>
  </footer>
  <div id="invite" class="overlay">
    <div class="sheet" role="dialog" aria-label="Invite">
      <h2>Scan to join</h2>
      <div class="lead">Room: <b id="inviteRoom"></b></div>
      <div class="lead">Open the phone camera and point it at the code.</div>
      <div id="qr" class="qr"></div>
      <p id="joinUrl" class="url"></p>
      <p id="inviteNote" class="note" hidden></p>
      <p id="inviteCount" class="lead"></p>
      <label>Your name (shown on their phones)<input id="hostName" maxlength="30" placeholder="optional"></label>
      <button id="bDone" class="btn primary big">Done</button>
    </div>
  </div>
  <div id="rooms" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-label="Rooms">
      <h2>Rooms</h2>
      <div class="lead">Each room has its own QR code and transcript. People who joined a room before reconnect by themselves whenever you open it.</div>
      <div id="roomList" class="roomlist"></div>
      <form id="addRoom" class="addroom"><input id="newRoomName" maxlength="40" placeholder="New room, e.g. Math class" autocomplete="off"><button class="btn primary">Add</button></form>
      <button id="bRoomsDone" class="btn big mt" type="button">Done</button>
    </div>
  </div>
</div>
</template>

<template id="tpl-guest">
<div class="gwrap">
  <section id="gJoin" class="card">
    <h1>Live Captions</h1>
    <p class="lead">What you say will appear as text on the screen of the person who showed you this code.</p>
    <label>Your name<input id="gName" maxlength="30" autocomplete="given-name" placeholder="e.g. Maria" enterkeyhint="go"></label>
    <label>Language you'll speak<select id="gLang"></select></label>
    <p id="gWarn" class="warn" hidden></p>
    <button id="gJoinBtn" class="btn primary big">Join and start talking</button>
  </section>
  <section id="gMain" class="gmain" hidden>
    <div class="gtop"><span id="gDot" class="dot warn"></span><span id="gStatus">Connecting…</span><button id="gMe" class="chip" title="Change name or language"></button></div>
    <div id="gReply" class="replycard" hidden><div id="gReplyFrom" class="from"></div><div id="gReplyText"></div></div>
    <button id="gMic" class="mic" aria-label="Microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
    </button>
    <p id="gHint" class="hint"></p>
    <div class="heard"><div id="gHist"></div><div id="gLive" class="livebig"></div><div id="gLegend" class="legend" hidden>✓ = on their screen · … = still sending</div></div>
    <form id="gTypeForm" class="typeform"><input id="gType" placeholder="Or type a message…" autocomplete="off" enterkeyhint="send" maxlength="1000"><button class="btn">Send</button></form>
  </section>
</div>
</template>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const params = new URLSearchParams(location.search);
const joinId = (params.get('join') || '').trim();
const PREFIX = 'lc-';
const HUES = [205, 30, 130, 330, 55, 270, 175, 0, 95, 240];
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const APP_V = 5; // bump on every update: phones on an older version reload themselves
// whose speech engine this browser uses: Apple's (every iPhone/iPad browser, Mac Safari) or Google's.
// Their confidence scores run on different scales, so they're only compared like-for-like.
const ENGINE = (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
  (/Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Android/.test(navigator.userAgent))) ? 'apple' : 'google';
const LANGS = [['en-US','English (US)'],['en-GB','English (UK)'],['es-US','Español (EE. UU.)'],['es-MX','Español (México)'],['es-ES','Español (España)'],['fr-FR','Français'],['de-DE','Deutsch'],['it-IT','Italiano'],['pt-BR','Português (Brasil)'],['zh-CN','中文 (普通话)'],['zh-TW','中文 (台灣)'],['ja-JP','日本語'],['ko-KR','한국어'],['ru-RU','Русский'],['uk-UA','Українська'],['ar-SA','العربية'],['hi-IN','हिन्दी'],['vi-VN','Tiếng Việt']];

function rid(n) { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; }
function clip(s, n) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, n); }
function hhmm(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function mount(id) { document.body.append(document.getElementById(id).content.cloneNode(true)); }
function fatal(msg) { document.body.textContent = ''; const d = document.createElement('div'); d.className = 'card fatal'; d.textContent = msg; document.body.append(d); }

/* theme */
function applyTheme() { const t = store.get('lc_theme', ''); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  store.set('lc_theme', dark ? 'light' : 'dark'); applyTheme();
}
applyTheme();

/* keep screen awake */
let wakeLock = null, wantWake = false;
async function keepAwake(on) {
  wantWake = on;
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantWake) keepAwake(true); });

/* Speech-to-text: one utterance per recognition session, restarted automatically.
   (continuous=false is the mode that behaves the same on Android Chrome, desktop Chrome and iOS Safari.) */
class Listener {
  constructor(o) {
    this.o = o; this.lang = o.lang; this.want = false; this.rec = null; this.errs = 0; this.n = 0; this.prefix = rid(4);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && this.want && !this.rec) this._spawn(); });
  }
  start() { if (!SR) return; this.want = true; this.errs = 0; if (!this.rec) this._spawn(); this.o.onState('on'); }
  stop() { this.want = false; if (this.rec) try { this.rec.stop(); } catch (e) {} this.o.onState('off'); }
  setLang(l) { this.lang = l; if (this.rec) try { this.rec.abort(); } catch (e) {} }
  _spawn() {
    let r;
    try { r = new SR(); } catch (e) { this.want = false; this.o.onState('off'); this.o.onError('unsupported'); return; }
    this.rec = r;
    const uid = this.prefix + (++this.n);
    let text = '', done = false;
    r.lang = this.lang; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    r.onresult = e => {
      if (done) return;
      const parts = []; let cs = 0, cn = 0;
      for (let i = 0; i < e.results.length; i++) {
        const a = e.results[i][0]; parts.push(a.transcript.trim());
        if (e.results[i].isFinal && a.confidence > 0) { cs += a.confidence; cn++; }
      }
      text = parts.join(' ').trim(); this.errs = 0;
      // confidence: how sure the speech engine is (0–1); a phone far from the speaker is usually less sure
      if (e.results[e.results.length - 1].isFinal) { done = true; this.o.onFinal(uid, text, cn ? cs / cn : 0); }
      else this.o.onPartial(uid, text);
    };
    r.onerror = e => {
      const k = e.error;
      if (k === 'not-allowed' || k === 'service-not-allowed') { this.want = false; this.o.onState('off'); this.o.onError('blocked'); }
      else if (k !== 'no-speech' && k !== 'aborted') { this.errs++; this.o.onError(k); }
    };
    r.onend = () => {
      if (!done && text) this.o.onFinal(uid, text);
      if (this.rec === r) this.rec = null;
      if (this.want && document.visibilityState === 'visible') {
        const d = this.errs ? Math.min(5000, 600 * this.errs) : 50;
        setTimeout(() => { if (this.want && !this.rec) this._spawn(); }, d);
      }
    };
    try { r.start(); }
    catch (e) { this.rec = null; this.errs++; setTimeout(() => { if (this.want && !this.rec) this._spawn(); }, 1000); }
  }
}

/* Connections: messages travel through public MQTT relays over secure websockets, which work on
   Wi-Fi, mobile data and VPNs alike. Two relays are used at once, so one being down doesn't matter.
   Every message is end-to-end encrypted with the room's key, which exists only in the QR code link
   (after the #, so it is never sent to any server) — the relays only ever see scrambled bytes. */
const RELAYS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const TOPIC = 'live-captions-v1/';
const joinKey = (location.hash.match(/k=([A-Za-z0-9_-]{16,})/) || [])[1] || '';
const b64u = {
  enc: u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))

async function seal(key, obj) {

}

}
class Relay {

      let c;
      try { c = mqtt.connect(url, { clean: true, connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 20, clientId: 'lc_' + rid(12) }); } catch (e) { continue; }

      c.on('message', (topic, payload) => {
        const key = this.key; if (!key) return;
        unseal(key, payload).then(m => { if (m && key === this.key) this.onMessage(topic, m); });

    }
  }
  get up() { return this.clients.some(c => c.connected); }
  setSubs(subs) {
    for (const c of this.clients) if (c.connected) { if (this.subs.length) c.unsubscribe(this.subs); if (subs.length) c.subscribe(subs, { qos: 0 }); }

      .catch(() => {});

  }
}

/* ======================= HOST (the deaf user's screen) ======================= */
function startHost() {
  mount('tpl-host');
  const feed = $('#feed'), chips = $('#chips'), jump = $('#jump');
  /* rooms: each has its own code (peer id) and its own transcript */
  const validId = id => typeof id === 'string' && /^lc-[a-z0-9]{6,24}$/.test(id);
  let rooms = store.get('lc_rooms', null);
  if (!Array.isArray(rooms) || !rooms.length) { // first run, or upgrade from the one-room version
    const old = store.get('lc_room', '');
    const id = validId(old) ? old : PREFIX + rid(10);

    store.set('lc_log_' + id, store.get('lc_log', []));
    store.set('lc_rooms', rooms);
    try { localStorage.removeItem('lc_log'); } catch (e) {}
  }
  const validKey = k => typeof k === 'string' && /^[A-Za-z0-9_-]{22}$/.test(k);
  rooms = rooms.filter(r => r && validId(r.id)).map(r => ({ id: r.id, name: clip(r.name, 40) || 'Room', key: validKey(r.key) ? r.key : newKey() }));
  if (!rooms.length) rooms = [{ id: PREFIX + rid(10), name: 'Room 1', key: newKey() }];
  let roomId = store.get('lc_room', '');
  if (!rooms.some(r => r.id === roomId)) roomId = rooms[0].id;
  store.set('lc_room', roomId);
  const saveRooms = () => store.set('lc_rooms', rooms);
  saveRooms();
  const room = () => rooms.find(r => r.id === roomId) || rooms[0];
  const roomName = () => room().name;
  const H = { relay: null, speakers: new Map(), live: new Map(), done: new Set(), seq: new Map(), log: [], lastTurn: null, hostName: store.get('lc_hostname', ''), roomMic: null };

  /* text size */
  let fs = store.get('lc_fs', 30);
  const setFs = v => { fs = Math.max(16, Math.min(80, v)); document.documentElement.style.setProperty('--fs', fs + 'px'); store.set('lc_fs', fs); };
  setFs(fs);
  $('#bSmaller').onclick = () => { const n = nearBottom(); setFs(fs - 4); if (n) toBottom(); };
  $('#bBigger').onclick = () => { const n = nearBottom(); setFs(fs + 4); if (n) toBottom(); };

  /* scrolling */
  function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140; }
  function toBottom() { feed.scrollTop = feed.scrollHeight; jump.hidden = true; }
  function after(wasNear) { if (wasNear) toBottom(); else jump.hidden = false; }
  feed.addEventListener('scroll', () => { if (nearBottom()) jump.hidden = true; });
  jump.onclick = toBottom;

  /* colors */
  function hueFor(cid) {
    const map = store.get('lc_hues', {});
    if (typeof map[cid] === 'number') return map[cid];
    const online = new Set([...H.speakers.values()].filter(s => s.conns.size).map(s => s.hue));
    const used = new Set(Object.values(map));
    let h = HUES.find(x => !online.has(x) && !used.has(x));
    if (h == null) h = HUES.find(x => !online.has(x));
    if (h == null) h = HUES[Object.keys(map).length % HUES.length];
    map[cid] = h; store.set('lc_hues', map); return h;
  }

  /* transcript */
  function turnFor(k, name, hue, ts) {
    const L = H.lastTurn;
    if (L && L.k === k && ts - L.at < 90000 && L.el.isConnected) { L.at = ts; return L; }
    const el = document.createElement('div'); el.className = 'turn' + (k === 'me' ? ' me' : '');
    el.dataset.k = k;
    if (hue != null) el.style.setProperty('--h', hue);
    const who = document.createElement('div'); who.className = 'who';
    const nm = document.createElement('span'); nm.textContent = name;
    const tm = document.createElement('time'); tm.textContent = hhmm(ts);
    who.append(nm, tm);
    const said = document.createElement('div'); said.className = 'said';
    el.append(who, said); feed.append(el);
    $('#empty').hidden = true;
    return (H.lastTurn = { k, el, said, at: ts, line: null, lineAt: 0 });
  }
  /* inside one person's block: a pause of 2.5 s or more starts a new line */
  const LINE_GAP = 2500;
  function lineFor(turn, ts, forceNew) {
    const fresh = forceNew === undefined ? (!turn.line || !turn.line.isConnected || ts - turn.lineAt > LINE_GAP) : (forceNew || !turn.line || !turn.line.isConnected);
    if (fresh) { turn.line = document.createElement('div'); turn.line.className = 'line'; turn.said.append(turn.line); }
    turn.lineAt = ts; turn.fresh = fresh;
    return turn.line;
  }
  let saveTimer = 0;
  function flushLog() { clearTimeout(saveTimer); if (H.log.length > 3000) H.log = H.log.slice(-3000); store.set('lc_log_' + roomId, H.log); }
  function saveLog() { clearTimeout(saveTimer); saveTimer = setTimeout(flushLog, 400); }
  function addFinal(k, name, hue, text, ts = Date.now(), save = true, nl) {
    const near = nearBottom();
    const t = turnFor(k, name, hue, ts);
    const s = document.createElement('span'); s.className = 'fin'; s.textContent = text + ' ';
    lineFor(t, ts, save ? undefined : nl).append(s);
    H.log.push({ k, n: name, h: hue, t: text, ts, nl: t.fresh });
    if (save) saveLog();
    after(near);
  }
  /* Same room, several phones: everyone's phone hears everyone. When two phones send nearly the
     same sentence within 10 seconds, keep one copy, credited to the phone that heard it best
     (higher speech-engine confidence; if that's unclear, the one that caught more words). */
  /* how eager the filter is:
     window  – how far apart (ms) two phones' copies can arrive and still count as one sentence
     overlap – share of words they must have in common
     minWords – shorter sentences are never merged ("yes" from two people is two answers)
     floor   – Strict only: a sentence no other phone sent, heard with confidence below this, is
               treated as far-away speech and hidden (0 = unknown confidence, never hidden) */
  const SENS = {
    off:    { label: 'Off',    help: 'Every phone’s text is shown, even when two phones heard the same thing.' },
    gentle: { label: 'Gentle', window: 6000,  overlap: 0.75, minWords: 4, floor: 0,   help: 'Merges only near-identical repeats. Least likely to hide anything.' },
    normal: { label: 'Normal', window: 10000, overlap: 0.6,  minWords: 3, floor: 0,   help: 'Merges sentences that two phones both heard, keeping the clearer one.' },
    strict: { label: 'Strict', window: 15000, overlap: 0.45, minWords: 2, floor: 0.5, help: 'Merges more eagerly and also hides faint, far-away speech. May drop a quiet speaker.' }
  };
  H.sens = store.get('lc_sens', store.get('lc_dedupe', true) === false ? 'off' : 'normal');
  if (!SENS[H.sens]) H.sens = 'normal';
  H.recent = [];
  const wordsOf = t => t.toLowerCase().replace(/[^\p{L}\p{N}' ]+/gu, ' ').split(/\s+/).filter(Boolean);
  function similar(a, b) {
    const S = SENS[H.sens];
    if (Math.min(a.length, b.length) < S.minWords) return false;
    const count = new Map(); for (const w of a) count.set(w, (count.get(w) || 0) + 1);
    let common = 0; for (const w of b) { const n = count.get(w); if (n) { common++; count.set(w, n - 1); } }
    return common / Math.min(a.length, b.length) >= S.overlap;
  }
  function findDup(c) {
    const now = Date.now();
    H.recent = H.recent.filter(r => now - r.at < SENS.strict.window && r.span.isConnected);
    const win = SENS[H.sens].window;
    for (let i = H.recent.length - 1; i >= 0; i--) { const r = H.recent[i]; if (r.k !== c.k && now - r.at < win && similar(r.words, c.words)) return r; }
    return null;
  }
  /* Each phone is judged against its own normal: its average confidence over its last 40 sentences.

     above its own average; a phone across the table scores below its own. This works even when
     the phones use different speech engines (Apple's scores run lower than Google's). */

    if (!(conf > 0)) return;

  }

    if (c.conf > 0 && r.conf > 0) {
      const rc = relConf(c), rr = relConf(r);
      if (rc != null && rr != null && Math.abs(rc - rr) > 0.03) return rc > rr;

    }

  }
  function removeSpan(turn, span) {
    const line = span.parentNode;
    span.remove();
    if (line && line.classList.contains('line') && !line.childNodes.length) line.remove();
    if (!turn.said.childNodes.length) { turn.el.remove(); if (H.lastTurn === turn) H.lastTurn = null; }
  }
  function dropCommitted(r) {
    removeSpan(r.turn, r.span);
    const i = H.log.indexOf(r.entry); if (i >= 0) H.log.splice(i, 1);
    H.recent = H.recent.filter(x => x !== r);
    saveLog();
  }
  function liveText(k, name, hue, u, text, final, conf = 0, eg = 'google') {
    const key = k + '|' + u;
    let L = H.live.get(key);
    const near = nearBottom();
    if (!L) {
      if (!text) return;
      const now = Date.now();
      const turn = turnFor(k, name, hue, now);
      const span = document.createElement('span'); span.className = 'live';
      lineFor(turn, now).append(span);
      L = { k, name, hue, u, span, turn, nl: turn.fresh }; H.live.set(key, L);
    }
    L.at = Date.now();
    if (L.span.parentNode === L.turn.line) L.turn.lineAt = L.at; // still talking: the pause is measured from here
    if (final) {
      H.live.delete(key);
      const cand = { k, words: wordsOf(text), conf, eg, at: Date.now() };
      if (text) noteConf(k, conf);
      const S = SENS[H.sens], on = H.sens !== 'off';
      const dup = text && on ? findDup(cand) : null;
      const rel = relConf(cand);
      // Strict only: a sentence no other phone sent, heard well below this phone's normal (or, before
      // its normal is known, a low Google score) is treated as far-away speech
      const faint = on && !dup && k !== 'room' && S.floor && conf > 0 && (rel != null ? rel < -0.2 : (eg === 'google' && conf < S.floor));
      if (!text || faint || (dup && !beats(cand, dup))) {

      } else {
        if (dup) dropCommitted(dup); // this phone heard it better: take it away from the other one
        L.span.className = 'fin'; L.span.textContent = text + ' ';
        const entry = { k, n: name, h: hue, t: text, ts: Date.now(), nl: !!L.nl };
        H.log.push(entry); saveLog();

    renderChips();
    after(near);
  }
  function finalizeLive(k) {
    for (const L of [...H.live.values()]) if (L.k === k) liveText(k, L.name, L.hue, L.u, L.span.textContent.trim(), true);
  }
  function loadLog() {
    const saved = store.get('lc_log_' + roomId, []);

  /* people chips + status */

  renderSens();
  $('#bSave').onclick = () => {
    const lines = H.log.map(e => '[' + hhmm(e.ts) + '] ' + e.n + ': ' + e.t);
    const d = new Date(), p = x => String(x).padStart(2, '0');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/plain' }));
    a.download = 'captions-' + (roomName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'room') + '-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.txt';
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  };
  $('#bClear').onclick = () => {
    if (!confirm('Clear the whole transcript? This cannot be undone.')) return;
    H.log = []; flushLog(); H.live.clear(); H.lastTurn = null;
    feed.querySelectorAll('.turn').forEach(n => n.remove()); $('#empty').hidden = false;
    const keep = {}; for (const [k, s] of H.speakers) if (s.conns.size) keep[k] = s.hue;
    store.set('lc_hues', keep); renderChips();
  };

  /* room mic: lets the host device itself caption (e.g. for someone without a phone) */
  function roomSpeaker() {
    let sp = H.speakers.get('room');
    if (!sp) { sp = { name: 'Room mic', hue: hueFor('room'), conns: new Set() }; H.speakers.set('room', sp); }
    return sp;
  }
  $('#bRoom').onclick = () => {
    if (!SR) { alert('This browser can’t turn speech into text. On iPad use Safari; on Android use Chrome.'); return; }
    if (!H.roomMic) {
      H.roomMic = new Listener({
        lang: navigator.language || 'en-US',
        onPartial: (u, t) => { const sp = roomSpeaker(); liveText('room', sp.name, sp.hue, u, t, false); },
        onFinal: (u, t, cf) => { const sp = roomSpeaker(); liveText('room', sp.name, sp.hue, u, t, true, cf, ENGINE); },
        onState: s => {
          const sp = roomSpeaker();
          if (s === 'on') sp.conns.add('local'); else { sp.conns.delete('local'); finalizeLive('room'); }
          $('#bRoom').textContent = s === 'on' ? 'Stop room mic' : 'Room mic (this device listens)';
          renderChips();
        },
        onError: e => { if (e === 'blocked') alert('Microphone access was blocked for this page.'); }
      });
    }
    if (H.roomMic.want) H.roomMic.stop(); else H.roomMic.start();
  };

  /* replies from the deaf user to everyone's phones */
  function hostSend(to, m) { // to: one phone's id, or 'all'
    if (H.relay) H.relay.publish(TOPIC + roomId + (to === 'all' ? '/all' : '/g/' + to), m);
  }
  function sendReply(text) {
    text = clip(text, 1000); if (!text) return;
    hostSend('all', { t: 'reply', text, from: H.hostName });
    addFinal('me', H.hostName ? H.hostName + ' (you)' : 'You', null, text);
    toBottom();
  }
  const quick = $('#quick');
  for (const q of ['Yes', 'No', 'Please repeat that', 'Slower, please', 'One at a time, please', 'Thank you!']) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = q;
    b.onclick = () => sendReply(q); quick.append(b);
  }
  $('#replyForm').onsubmit = e => { e.preventDefault(); const i = $('#replyIn'); sendReply(i.value); i.value = ''; };

  /* networking: phones write to <room>/h; the screen answers each phone on <room>/g/<phone id>
     and everyone on <room>/all. Phones ping every 2 s; a phone silent for 15 s is shown as gone. */
  function onMsg(topic, m) {
    if (topic !== TOPIC + roomId + '/h' || !m || typeof m !== 'object') return;
    const cid = clip(m.c, 40); if (!/^c[a-z0-9]{8,20}$/.test(cid)) return;
    const now = Date.now();
    let sp = H.speakers.get(cid);
    if (m.t === 'ping' || m.t === 'hello') {
      const name = clip(m.n, 30) || 'Guest';
      const fresh = !sp || !sp.conns.has('net');
      if (!sp) { sp = { name, hue: hueFor(cid), conns: new Set() }; H.speakers.set(cid, sp); }
      const changed = fresh || sp.name !== name;
      sp.name = name; sp.seen = now; sp.conns.add('net');
      hostSend(cid, fresh || m.t === 'hello' ? { t: 'welcome', hue: sp.hue, host: H.hostName, v: APP_V } : { t: 'pong', v: APP_V });
      if (changed) renderChips();
      return;
    }
    if (!sp) return;
    sp.seen = now;
    if (!sp.conns.has('net')) { sp.conns.add('net'); renderChips(); }
    const u = clip(m.u, 24), key = cid + '|' + u;
    if (m.t === 'partial') {
      if (H.done.has(key)) return;
      const s = +m.s || 0; if (s < (H.seq.get(key) || 0)) return; // an older guess arriving late
      H.seq.set(key, s);
      liveText(cid, sp.name, sp.hue, u, clip(m.text, 4000), false);
    } else if (m.t === 'final' || m.t === 'typed') {
      if (!u) return;
      hostSend(cid, { t: 'ack', u });   // receipt, so the phone stops resending
      if (H.done.has(key)) return;      // a resend (or the copy from the second relay) we already have
      H.done.add(key); H.seq.delete(key); if (H.done.size > 5000) H.done.clear();
      const t = clip(m.text, 4000);
      if (m.t === 'final') liveText(cid, sp.name, sp.hue, u, t, true, Math.max(0, Math.min(1, +m.cf || 0)), m.eg === 'apple' ? 'apple' : 'google');
      else if (t) addFinal(cid, sp.name, sp.hue, t);
    } else if (m.t === 'bye') { sp.conns.delete('net'); renderChips(); }
  }
  function useRoom() {
    const id = roomId;
    H.relay.key = null;
    H.relay.setSubs([TOPIC + id + '/h']);
    importKey(room().key).then(k => { if (roomId === id) H.relay.key = k; });
  }
  H.relay = new Relay(onMsg);
  H.relay.start();
  useRoom();
  setInterval(() => {
    const now = Date.now();
    for (const sp of H.speakers.values()) if (sp.conns.has('net') && now - (sp.seen || 0) > 15000) { sp.conns.delete('net'); renderChips(); }
    // live text whose finished sentence never arrived: keep what we have
    for (const L of [...H.live.values()]) if (L.k !== 'room' && now - L.at > 45000) {
      H.done.add(L.k + '|' + L.u); liveText(L.k, L.name, L.hue, L.u, L.span.textContent.trim(), true);
    }
    setStatus();
  }, 2000);
  renderChips();
  keepAwake(true);
  document.addEventListener('click', () => keepAwake(true), { once: true });
}

/* ======================= GUEST (a speaker's phone) ======================= */
function startGuest() {
  mount('tpl-guest');
  let cid = store.get('lc_cid', '');
  if (!/^c[a-z0-9]{8,20}$/.test(cid)) { cid = 'c' + rid(12); store.set('lc_cid', cid); }
  const G = { name: store.get('lc_name', ''), lang: store.get('lc_lang', ''), relay: null, lastHeard: 0, everLinked: false, downSince: 0, seq: 0, hue: null, joined: false, outbox: new Map(), pending: null, partialAt: 0, partialTimer: 0, hist: [], host: '' };
  if (!G.lang) { const nl = navigator.language || 'en-US'; G.lang = (LANGS.find(l => l[0] === nl) || LANGS.find(l => l[0].slice(0, 2) === nl.slice(0, 2)) || LANGS[0])[0]; }
  const wrap = $('.gwrap');
  const sel = $('#gLang');
  for (const [code, label] of LANGS) { const o = document.createElement('option'); o.value = code; o.textContent = label; sel.append(o); }
  sel.value = G.lang;
  $('#gName').value = G.name;

  const warns = [];
  if (!SR) warns.push('This browser can’t turn speech into text (on Android use Chrome, on iPhone use Safari). You can still type messages.');
  else if (!window.isSecureContext) warns.push('The microphone only works from an https:// address. You can still type messages.');
  if (warns.length) { $('#gWarn').textContent = warns.join(' '); $('#gWarn').hidden = false; }
  if (!SR) { $('#gJoinBtn').textContent = 'Join'; $('#gMic').hidden = true; }
  // just reloaded itself for an update: one tap gets back in (the mic needs a tap to start)
  let upd = ''; try { upd = sessionStorage.getItem('lc_upd') || ''; } catch (e) {}
  if (upd === String(APP_V) && G.name) {
    try { sessionStorage.setItem('lc_upd', 'shown-' + APP_V); } catch (e) {}
    const n = $('#gWarn'); n.textContent = 'The app was just updated. Tap the button below to keep going.' + (warns.length ? ' ' + warns.join(' ') : '');
    n.hidden = false; $('#gJoinBtn').textContent = 'Keep going';
  }

  const hint = $('#gHint');
  function setHint(t, bad) { hint.textContent = t; hint.className = 'hint' + (bad ? ' bad' : ''); }
  const listener = SR ? new Listener({
    lang: G.lang,
    onPartial: (u, t) => { sendPartial(u, t); $('#gLive').textContent = t; if (hint.classList.contains('bad')) renderMic(); },
    onFinal: (u, t, cf) => { sendFinal('final', u, t, cf); pushHist(t, u); $('#gLive').textContent = ''; },
    onState: () => renderMic(),
    onError: e => {
      if (e === 'blocked') setHint('The microphone is blocked. Allow it for this site in your browser settings, then tap the mic.', true);
      else if (e === 'network') setHint('Speech service can’t be reached — retrying…', true);
      else setHint('Speech problem (' + e + ') — retrying…', true);
    }
  }) : null;

  function renderMic() {
    const on = !!(listener && listener.want);
    $('#gMic').classList.toggle('on', on);
    $('#gMic').setAttribute('aria-pressed', String(on));
    setHint(on ? 'Listening — speak normally. Keep this screen open. Tap to pause.' : 'Paused. Tap the microphone to talk.');
    keepAwake(on);
  }
  function pushHist(t, u) {
    if (!t) return;
    G.hist.push({ t, u, ok: false }); if (G.hist.length > 3) G.hist.shift();
    renderHist();
  }
  function renderHist() {
    const h = $('#gHist'); h.textContent = '';
    for (const x of G.hist) {
      const d = document.createElement('div'); d.className = 'old'; d.textContent = x.t + ' ';
      const s = document.createElement('span'); s.className = x.ok ? 'tick ok' : 'tick';
      s.textContent = x.ok ? '✓' : '…'; s.title = x.ok ? 'On their screen' : 'Sending…';
      d.append(s); h.append(d);
    }
    $('#gLegend').hidden = !G.hist.length;
  }
  function renderMe() {
    const me = $('#gMe'); me.textContent = G.name + ' ✎';
    wrap.style.setProperty('--h', G.hue == null ? 205 : G.hue);
    me.style.setProperty('--h', G.hue == null ? 205 : G.hue);
  }
  /* connection state: "linked" means the captions screen itself answered in the last 9 seconds */
  const hostTopic = TOPIC + joinId + '/h';
  const linked = () => Date.now() - G.lastHeard < 9000;
  function setG() {
    let cls = 'warn', txt = 'Connecting…';
    const up = G.relay && G.relay.up;
    if (up || !G.joined) G.downSince = 0; else if (!G.downSince) G.downSince = Date.now();
    if (linked()) { cls = 'ok'; txt = 'Connected — your words appear on ' + (G.host ? G.host + '’s' : 'their') + ' screen'; }
    else if (up) txt = G.everLinked ? 'Lost the captions screen — reconnecting by itself…' : 'Waiting for the captions screen to answer… (it must be open on this room)';
    else if (G.downSince && Date.now() - G.downSince > 15000) { cls = 'bad'; txt = 'Can’t reach the internet from this phone. Check Wi-Fi or mobile data. Still trying…'; }
    $('#gDot').className = 'dot ' + cls; $('#gStatus').textContent = txt;
  }
  /* sending: live text is best-effort (and limited to 5 per second); finished sentences
     wait in an outbox until the captions screen confirms them, and are resent until it does */
  function raw(m) { m.c = cid; return G.relay.publish(hostTopic, m); }
  function sendPartial(u, text) {
    G.pending = { t: 'partial', u, text, s: ++G.seq };
    const wait = 200 - (Date.now() - G.partialAt);
    if (wait > 0) { if (!G.partialTimer) G.partialTimer = setTimeout(flushPartial, wait); return; }
    flushPartial();
  }
  function flushPartial() {
    G.partialTimer = 0; const m = G.pending; if (!m) return;
    G.pending = null; G.partialAt = Date.now(); raw(m);
  }
  function sendFinal(t, u, text, cf) {
    if (!text) return;
    if (G.pending && G.pending.u === u) G.pending = null;
    G.outbox.set(u, { m: { t, u, text, cf: +(cf || 0).toFixed(3), eg: ENGINE }, at: 0 });
    while (G.outbox.size > 100) G.outbox.delete(G.outbox.keys().next().value);
    flushOutbox();
  }
  function flushOutbox(force) {
    const now = Date.now();
    for (const e of G.outbox.values()) if (force || now - e.at > 5000) { if (raw(e.m)) e.at = now; else break; }
  }
  function onMsg(topic, m) {
    if (!m || typeof m !== 'object') return;
    // the captions screen runs a newer version of the app: reload once to pick it up
    if (typeof m.v === 'number' && m.v > APP_V) {
      let tried = ''; try { tried = sessionStorage.getItem('lc_upd') || ''; } catch (e) {}
      if (tried !== String(m.v)) {
        try { sessionStorage.setItem('lc_upd', String(m.v)); } catch (e) {}
        flushOutbox(true);
        setTimeout(() => location.reload(), 400);
        return;
      }
    }
    const was = linked();
    G.lastHeard = Date.now(); G.everLinked = true;
    if (!was) { flushOutbox(true); setG(); } // back in touch: send anything still waiting
    if (m.t === 'ack') {
      G.outbox.delete(m.u);
      for (const x of G.hist) if (x.u === m.u) x.ok = true;
      renderHist();
    }
    else if (m.t === 'welcome') { G.hue = HUES.includes(m.hue) ? m.hue : null; G.host = clip(m.host, 30); renderMe(); setG(); }
    else if (m.t === 'host') { G.host = clip(m.name, 30); setG(); }
    else if (m.t === 'reply') {
      G.host = clip(m.from, 30) || G.host;
      $('#gReplyFrom').textContent = (G.host || 'They') + ' wrote:';
      $('#gReplyText').textContent = clip(m.text, 1000);
      $('#gReply').hidden = false;
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
    }
  }
  function tick() {
    if (!G.joined) return;
    // "hello" until the screen has told us our color, then a light "ping" (both carry our name)
    raw(G.hue == null ? { t: 'hello', n: G.name } : { t: 'ping', n: G.name });
    if (linked()) flushOutbox();
    setG();
  }
  G.relay = new Relay(onMsg);
  G.relay.setSubs([TOPIC + joinId + '/g/' + cid, TOPIC + joinId + '/all']);
  G.relay.start();
  importKey(joinKey).then(k => { G.relay.key = k; tick(); });
  setInterval(tick, 2000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });
  addEventListener('pagehide', () => { raw({ t: 'bye' }); });

  function join() {
    const name = clip($('#gName').value, 30);
    if (!name) { $('#gName').focus(); $('#gName').placeholder = 'Please type your name'; return; }
    const langChanged = sel.value !== G.lang;
    G.name = name; G.lang = sel.value; store.set('lc_name', name); store.set('lc_lang', G.lang);
    $('#gJoin').hidden = true; $('#gMain').hidden = false; renderMe();
    if (!G.joined) {
      G.joined = true; setG(); tick();
      if (listener) listener.start(); // inside the tap, so the browser can ask for the mic
      else setHint('Type below — your messages appear on their screen.');
    } else {
      raw({ t: 'hello', n: G.name });
      if (listener && langChanged) listener.setLang(G.lang);
    }
  }
  $('#gJoinBtn').onclick = join;
  $('#gName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); join(); } });
  $('#gMe').onclick = () => { $('#gJoinBtn').textContent = 'Save'; $('#gJoin').hidden = false; $('#gMain').hidden = true; };
  $('#gMic').onclick = () => { if (!listener) return; if (listener.want) listener.stop(); else listener.start(); };
  $('#gTypeForm').onsubmit = e => {
    e.preventDefault();
    const i = $('#gType'), t = clip(i.value, 1000); if (!t) return;
    const u = 't' + rid(8);
    sendFinal('typed', u, t); pushHist('⌨ ' + t, u); i.value = '';
  };
}

/* ======================= boot ======================= */
if (typeof mqtt === 'undefined' || typeof qrcode === 'undefined' || !window.crypto || !crypto.subtle) fatal('Couldn’t load the connection tools. Check the internet connection and reload the page (it must be opened from its https:// web address).');
else if (joinId && !joinKey) fatal('This link is missing part of its code. Scan the QR code on the captions screen again.');
else if (joinId) startGuest();
else startHost();
</script>
</body>
</html>
